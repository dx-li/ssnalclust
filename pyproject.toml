[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssnalclust"
version = "0.1.0"
description = "Convex clustering with certified solvers and a scikit-learn interface"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.12", "scikit-learn>=1.6"]

[project.urls]
Repository = "https://github.com/dx-li/ssnalclust"
Issues = "https://github.com/dx-li/ssnalclust/issues"

[project.optional-dependencies]
test = ["pytest>=8", "cvxpy>=1.5", "pandas>=1.5.3"]
dev = ["pytest>=8", "cvxpy>=1.5", "pandas>=1.5.3", "ruff", "build"]
examples = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
