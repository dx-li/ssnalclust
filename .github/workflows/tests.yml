name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,examples]'
      - run: python -m pytest -q
      - run: ruff check src tests examples scripts docs/conf.py
      - run: python examples/basic_usage.py
      - run: python examples/missing_usage.py
      - run: python examples/structured_usage.py
      - run: python examples/generalized_usage.py
      - run: python examples/repeated_solves.py
      - run: python examples/recovery_study.py --smoke --self-test
      - run: python examples/plot_clustering_paths.py --output /tmp/clustering_paths.png
      - name: Run offline digits smoke study and plot its saved results
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: |
          python examples/digits_study.py --smoke --neighbors 10 20 --output build/artifacts/digits-smoke.json --arrays build/artifacts/digits-smoke.npz
          python examples/plot_digits_study.py build/artifacts/digits-smoke.json --output-dir build/artifacts/digits-smoke-plots
      - name: Run offline streaming memory smoke study and audit mode parity
        run: |
          python examples/streaming_memory.py --smoke --output build/artifacts/streaming-smoke.jsonl
          python examples/plot_streaming_memory.py build/artifacts/streaming-smoke.jsonl --output build/artifacts/streaming-smoke.png --audit build/artifacts/streaming-smoke-audit.json
      - name: Run offline Wine holdout smoke study and independent artifact audit
        run: |
          python examples/wine_holdout_study.py --smoke --output-dir build/artifacts/wine-holdout
          python examples/plot_wine_holdout.py build/artifacts/wine-holdout/study.json --output build/artifacts/wine-holdout.png
          python examples/audit_wine_holdout.py build/artifacts/wine-holdout --output build/artifacts/wine-holdout/audit.json
      - run: python -m build
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[test,examples]' matplotlib==3.8.0 pandas==1.5.3 numpy==1.24.0 scipy==1.12.0 scikit-learn==1.6.0 cvxpy==1.5.0
      - run: python -m pytest -q
  documentation-and-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[docs]' build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Build source-archive documentation with warnings as errors
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tarfile

          archives = list(Path("dist").glob("ssnalclust-*.tar.gz"))
          assert len(archives) == 1, archives
          destination = Path("build/documentation-source")
          with tarfile.open(archives[0]) as archive:
              archive.extractall(destination, filter="data")
          sources = list(destination.glob("ssnalclust-*/docs"))
          assert len(sources) == 1, sources
          subprocess.run([
              sys.executable, "-m", "sphinx", "-E", "-b", "html", "-W", "--keep-going",
              str(sources[0]), "build/docs/html",
          ], check=True)
          PY
      - name: Verify isolated wheel and source installations
        run: >-
          python scripts/check_distribution.py dist/ssnalclust-*.whl
          --sdist dist/ssnalclust-*.tar.gz
          --report build/artifacts/distribution-validation.json
      - name: Retain documentation and package validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: documentation-and-distributions
          path: |
            build/docs/html/
            build/artifacts/distribution-validation.json
            dist/
          if-no-files-found: error
          retention-days: 14
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install the built wheel with validation extras
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path("dist").glob("ssnalclust-*.whl"))
          assert len(wheels) == 1, wheels
          subprocess.run([
              sys.executable, "-m", "pip", "install",
              str(wheels[0].resolve()) + "[dev,examples]",
          ], check=True)
          PY
      - name: Record environment and installed-package provenance
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          from pathlib import Path
          import platform
          import site
          import sys
          import ssnalclust

          module = Path(ssnalclust.__file__).resolve()
          assert not module.is_relative_to(Path.cwd().resolve()), module
          assert any(module.is_relative_to(Path(p).resolve()) for p in site.getsitepackages())
          report = dict(
              python=sys.version, platform=platform.platform(), machine=platform.machine(),
              module=str(module), versions={name: metadata.version(name) for name in
                  ["ssnalclust", "numpy", "scipy", "scikit-learn", "cvxpy", "pytest"]},
          )
          destination = Path("build/artifacts")
          destination.mkdir(parents=True, exist_ok=True)
          (destination / "environment.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
          python -m pip freeze > build/artifacts/dependencies.txt
      - name: Run the full scientific suite
        run: python -m pytest -q -ra --junitxml=build/artifacts/tests.xml
      - name: Run user workflows
        run: |
          python examples/basic_usage.py
          python examples/missing_usage.py
          python examples/structured_usage.py
          python examples/generalized_usage.py
          python examples/repeated_solves.py
          python examples/recovery_study.py --smoke --self-test
          python examples/plot_clustering_paths.py --output build/artifacts/clustering_paths.png
      - name: Run offline digits smoke study and plot its saved results
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: |
          python examples/digits_study.py --smoke --neighbors 10 20 --output build/artifacts/digits-smoke.json --arrays build/artifacts/digits-smoke.npz
          python examples/plot_digits_study.py build/artifacts/digits-smoke.json --output-dir build/artifacts/digits-smoke-plots
      - name: Run offline streaming memory smoke study and audit mode parity
        run: |
          python examples/streaming_memory.py --smoke --output build/artifacts/streaming-smoke.jsonl
          python examples/plot_streaming_memory.py build/artifacts/streaming-smoke.jsonl --output build/artifacts/streaming-smoke.png --audit build/artifacts/streaming-smoke-audit.json
      - name: Run offline Wine holdout smoke study and independent artifact audit
        run: |
          python examples/wine_holdout_study.py --smoke --output-dir build/artifacts/wine-holdout
          python examples/plot_wine_holdout.py build/artifacts/wine-holdout/study.json --output build/artifacts/wine-holdout.png
          python examples/audit_wine_holdout.py build/artifacts/wine-holdout --output build/artifacts/wine-holdout/audit.json
      - name: Verify isolated wheel and source installations
        run: >-
          python scripts/check_distribution.py dist/ssnalclust-*.whl
          --sdist dist/ssnalclust-*.tar.gz
          --report build/artifacts/distribution-validation.json
      - name: Retain platform validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-validation-${{ matrix.os }}
          path: build/artifacts/
          if-no-files-found: warn
          retention-days: 14
