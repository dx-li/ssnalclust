name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check src tests examples
      - run: python examples/basic_usage.py
      - run: python examples/missing_usage.py
      - run: python examples/structured_usage.py
      - run: python examples/generalized_usage.py
      - run: python -m build
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install '.[test]' numpy==1.24.0 scipy==1.12.0 scikit-learn==1.6.0 cvxpy==1.5.0
      - run: python -m pytest -q
